name: CI
on:
  push: { branches: [development, main] }
  pull_request: { branches: [main] }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run verify:html
  e2e:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-traces, path: test-results, retention-days: 7 }
  lighthouse:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      # Indexing on for this throwaway build only, so the SEO score measures the page that ships at launch.
      - run: npm run build
        env: { VERCEL_ENV: production, SITE_INDEXING: "on" }
      # Budgets in lighthouserc.json for performance (0.8), LCP (5 s) and script size (300 KiB) are ratchets, not targets: an empty Next 16.4.2 page already ships 137 KB of script and
      # the site ships about 255 to 280 KB. They fail on a regression (a crypto polyfill once added 140 KB), not on the design weight. Tighten them as the bundle shrinks.
      # The contact page asks /api/form-token for a spam-check token; without these settings it answers 503 and the browser console logs an error. Throwaway values, never used to send mail.
      - run: npx @lhci/cli@0.15.x autorun
        env:
          BREVO_API_KEY: lighthouse-not-a-real-key
          FORM_SECRET: lighthouse-form-secret-0123456789abcdef
          CONTACT_INBOX: lighthouse@example.com
          MAIL_SENDER: lighthouse@example.com
